services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talk_to_data
      POSTGRES_PASSWORD: talk_to_data
      POSTGRES_DB: talk_to_data
    ports:
      - "5432:5432"
    volumes:
      # Bind-mount to host so DB survives container removal and `docker compose down`.
      # $HOME expands to the host user's home directory.
      - ${HOME}/.datahub/analytics-agent/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk_to_data"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MAXUN_ANALYTICS_BUILD_SHA: ${MAXUN_ANALYTICS_BUILD_SHA:-unknown}
    ports:
      - "8100:8100"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://talk_to_data:talk_to_data@postgres:5432/talk_to_data
      ANALYTICS_AGENT_SERVICE_ID: ${ANALYTICS_AGENT_SERVICE_ID:-maxun-analytics-agent}
      ANALYTICS_AGENT_RELEASE_REPOSITORY: ${ANALYTICS_AGENT_RELEASE_REPOSITORY:-Fatih0234/maxun-analytics-agent}
      MAXUN_ANALYTICS_BUILD_SHA: ${MAXUN_ANALYTICS_BUILD_SHA:-unknown}
      MAXUN_MATERIALIZATION_ROOT: /var/lib/maxun-analytics/materializations
      MAXUN_MATERIALIZATION_TTL_SECONDS: ${MAXUN_MATERIALIZATION_TTL_SECONDS:-86400}
      MAXUN_MATERIALIZATION_CLEANUP_INTERVAL_SECONDS: ${MAXUN_MATERIALIZATION_CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - maxun_materializations:/var/lib/maxun-analytics/materializations

volumes:
  maxun_materializations:
